services:
  - type: web
    name: tz-kp-compare
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_BASE
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_AI_SCOPE
        value: all
      - key: DEEPSEEK_MAX_AI_ROWS
        value: "300"
      - key: DEEPSEEK_BATCH_SIZE
        value: "20"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: Merenov.kirill@mail.ru
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "1"
